<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Track Your Order | Treats By Rich</title>
    <meta name="description" content="Track your Treats By Rich order in real time with a premium delivery experience." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <style>
      body {
        background: linear-gradient(180deg, #fffaf0 0%, var(--cream) 100%);
      }
      .tracking-shell {
        padding: 3.5rem 0 5rem;
      }
      .tracking-hero {
        display: grid;
        gap: 1.25rem;
        align-items: center;
        grid-template-columns: 1.15fr 0.85fr;
        padding: 2rem 0 2.4rem;
      }
      .tracking-hero-card,
      .tracking-search-card,
      .tracking-card,
      .timeline-card,
      .map-card,
      .history-card,
      .empty-card {
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(74, 36, 18, 0.08);
        border-radius: 1.8rem;
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }
      .tracking-hero-card {
        padding: 2rem;
      }
      .tracking-hero-card h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 3.1vw, 3rem);
        color: var(--brown);
        font-family: "Playfair Display", serif;
      }
      .tracking-hero-card p {
        margin: 0;
        color: var(--muted);
        max-width: 580px;
      }
      .hero-illustration {
        min-height: 300px;
        border-radius: 2rem;
        border: 1px solid rgba(74, 36, 18, 0.08);
        overflow: hidden;
        position: relative;
        box-shadow: 0 26px 56px rgba(33, 23, 16, 0.14);
      }
      .hero-illustration img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        border-radius: inherit;
        display: block;
      }
      .hero-illustration::after {
        content: "Premium Delivery • Real-time Updates";
        position: absolute;
        left: 1rem;
        right: 1rem;
        bottom: 1rem;
        padding: 0.8rem 1rem;
        border-radius: 999px;
        color: #fff;
        font-family: "Montserrat", sans-serif;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-align: center;
        background: rgba(36, 22, 14, 0.58);
        backdrop-filter: blur(8px);
      }
      .tracking-search-card {
        padding: 1.6rem;
        display: grid;
        gap: 1rem;
        margin-top: 1rem;
      }
      .tracking-search-card .input-row {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: 1fr auto;
      }
      .tracking-search-card input {
        border: 1px solid rgba(74, 36, 18, 0.12);
        border-radius: 999px;
        background: rgba(255, 248, 232, 0.82);
        padding: 0.95rem 1rem;
        font: inherit;
        color: var(--brown);
      }
      .tracking-search-card input:focus {
        outline: 2px solid rgba(245, 158, 11, 0.3);
        outline-offset: 2px;
      }
      .tracking-grid {
        display: grid;
        gap: 1.3rem;
        margin-top: 1.3rem;
      }
      .tracking-card {
        padding: 1.2rem 1.3rem;
        display: grid;
        gap: 1rem;
      }
      .tracking-card-header,
      .order-meta-grid,
      .summary-row,
      .item-row,
      .history-row {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        align-items: center;
      }
      .tracking-card-header h3,
      .tracking-card h3,
      .timeline-card h3,
      .map-card h3,
      .history-card h3 {
        margin: 0;
        color: var(--brown);
        font-family: "Playfair Display", serif;
      }
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.45rem 0.7rem;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--brown);
        background: rgba(255, 190, 50, 0.2);
      }
      .order-meta-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.9rem;
      }
      .meta-block {
        padding: 0.8rem 0.9rem;
        border-radius: 1rem;
        background: rgba(255, 248, 232, 0.9);
      }
      .meta-block small {
        display: block;
        color: var(--muted);
        font-size: 0.76rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: 0.35rem;
      }
      .meta-block strong {
        color: var(--brown);
      }
      .item-card {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 1rem;
        padding: 0.9rem;
        border-radius: 1.1rem;
        background: rgba(255, 248, 232, 0.8);
        border: 1px solid rgba(74, 36, 18, 0.08);
      }
      .item-card img {
        width: 82px;
        height: 82px;
        object-fit: cover;
        border-radius: 1rem;
      }
      .item-card h4 {
        margin: 0 0 0.2rem;
        color: var(--brown);
      }
      .item-card p {
        margin: 0.2rem 0;
        color: var(--muted);
        font-size: 0.92rem;
      }
      .timeline-card {
        padding: 1.25rem;
      }
      .timeline-list {
        margin-top: 1rem;
        display: grid;
        gap: 0.85rem;
        position: relative;
      }
      .timeline-list::before {
        content: "";
        position: absolute;
        left: 18px;
        top: 8px;
        bottom: 8px;
        width: 2px;
        background: rgba(74, 36, 18, 0.12);
      }
      .timeline-item {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.85rem;
        align-items: start;
      }
      .timeline-icon {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #f3e7d6;
        color: var(--muted);
        display: grid;
        place-items: center;
        position: relative;
        z-index: 1;
        transition: all 0.3s ease;
      }
      .timeline-item.completed .timeline-icon {
        background: linear-gradient(135deg, var(--gold), var(--orange));
        color: var(--brown);
      }
      .timeline-item.current .timeline-icon {
        animation: pulse 1.3s ease infinite;
        background: linear-gradient(135deg, var(--deep-orange), var(--orange));
        color: #fff;
      }
      .timeline-item.pending .timeline-icon {
        background: #efe7dc;
        color: var(--muted);
      }
      .timeline-content strong {
        display: block;
        color: var(--brown);
      }
      .timeline-content span {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .map-card,
      .history-card,
      .empty-card {
        padding: 1.2rem;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .map-placeholder {
        margin-top: 1rem;
        min-height: 200px;
        border-radius: 1.2rem;
        background: linear-gradient(135deg, rgba(74, 36, 18, 0.9), rgba(245, 158, 11, 0.92));
        display: grid;
        place-items: center;
        color: #fff;
        text-align: center;
        padding: 1rem;
      }
      .map-placeholder .pin {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.16);
        display: grid;
        place-items: center;
        margin-bottom: 0.75rem;
      }
      .map-placeholder .pin svg {
        width: 1.2rem;
        height: 1.2rem;
      }
      .empty-card {
        text-align: center;
        display: grid;
        gap: 1rem;
        justify-items: center;
      }
      .empty-illustration {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background: rgba(245, 158, 11, 0.16);
        display: grid;
        place-items: center;
        color: var(--deep-orange);
      }
      .empty-illustration svg {
        width: 2.2rem;
        height: 2.2rem;
      }
      .tracking-layout {
        display: grid;
        grid-template-columns: 1.4fr 0.85fr;
        gap: 1.3rem;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
      }
      @media (max-width: 960px) {
        .tracking-hero,
        .tracking-layout {
          grid-template-columns: 1fr;
        }
        .order-meta-grid {
          grid-template-columns: 1fr;
        }
      }

      /* Tracking results are injected after page load */
      #trackingContent .reveal {
        opacity: 1 !important;
        visibility: visible !important;
        transform: none !important;
      }
    </style>
  </head>
  <body>
    <header class="site-header" id="top">
      <div class="container nav-shell">
        <a class="brand" href="index.html" aria-label="Treats By Rich home">
          <img src="images/logo.png" alt="Treats By Rich logo" />
          <span>
            <strong>Treats By Rich</strong>
            <small>Love at First Scoop</small>
          </span>
        </a>
          <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="site-nav">
            <span></span>
            <span></span>
            <span></span>
          </button>
          <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
          <a href="index.html">Home</a>
          <a href="menu.html">Menu</a>
          <a href="about.html">About</a>
          <a href="gallery.html">Gallery</a>
            <a href="events.html">Events</a>
          <a href="contact.html">Contact</a>
          <a href="order-tracking.html">Track Order</a>
          <a class="nav-cart" href="cart.html" aria-label="View cart">
            <span class="icon icon-cart" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle><path d="M2 3h3l3.2 11.2a1 1 0 0 0 .97.8h8.98a1 1 0 0 0 .98-.8L21 7H7"></path></svg></span>
            <em class="cart-count">0</em>
          </a>
        </nav>
      </div>
    </header>

    <main class="tracking-shell">
      <div class="container">
        <section class="tracking-hero">
          <div class="tracking-hero-card reveal">
            <p class="eyebrow">Luxury Delivery</p>
            <h1>Track Your Order</h1>
            <p>Stay updated as your parfait is freshly prepared and delivered with the same premium care as every Treats By Rich creation.</p>
          </div>
          <div class="hero-illustration reveal" aria-hidden="true">
            <img id="trackingHeroImage" src="images/tracking/tracking-hero.jpg" alt="" loading="lazy" />
          </div>
        </section>

        <section class="tracking-search-card reveal" aria-labelledby="trackingSearchTitle">
          <h3 id="trackingSearchTitle">Track your order</h3>
          <form id="trackingForm" class="input-row" novalidate>
            <label class="sr-only" for="trackingNumber">Enter Order Number</label>
            <input id="trackingNumber" name="trackingNumber" type="text" placeholder="Example: TBR-2026-00125" autocomplete="off" />
            <button class="button button-primary" type="submit">Track Order</button>
          </form>
        </section>

        <div id="trackingContent" class="tracking-grid"></div>
      </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
    <script>
      (function setupTrackingHeroImage() {
        const heroImage = document.getElementById('trackingHeroImage');
        if (!heroImage) return;

        const candidates = [
          'images/tracking/tracking-hero.jpg',
          'images/tracking/tracking-hero.png'
        ];

        let index = 0;

        const tryNext = () => {
          index += 1;
          if (index < candidates.length) {
            heroImage.src = candidates[index];
            return;
          }

          // Prevent alt text showing on broken local image paths.
          heroImage.style.display = 'none';
        };

        heroImage.addEventListener('error', tryNext);
        heroImage.src = candidates[index];
      })();
    </script>
    <script type="module" src="js/tracking.js"></script>
  </body>
</html>
